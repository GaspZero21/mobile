name: madad_app
description: "A new Flutter project."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.1

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # API
  http: ^1.2.0
  http_parser: ^4.0.2

  # Store login token
  shared_preferences: ^2.2.3

  # State management
  provider: ^6.1.2

  # Loading animations
  flutter_spinkit: ^5.2.0

  # OpenStreetMap
  flutter_map: ^7.0.0
  latlong2: ^0.9.0

  # Deep links
  app_links: ^6.0.0

  # Media
  image_picker: ^1.1.2

  # Location
  geolocator: ^12.0.0     # ← Keep only this one
  geocoding: ^2.1.0

  # Firebase
  firebase_core: ^3.6.0
  firebase_messaging: ^15.1.3
  flutter_local_notifications: ^17.2.2
  

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.1

# App launcher icon config
flutter_launcher_icons:
  android: true
  ios: true
  remove_alpha_ios: true
  image_path: "assets/images/logo_full.png"
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/images/logo_full.png"

flutter:
  uses-material-design: true
  assets:
    - assets/images/logo_full.png
    - assets/images/logo_hand.png
    - assets/images/onboarding1.png
    - assets/images/onboarding2.png
    - assets/images/onboarding3.png
    - assets/images/welcome_illustration.png
    - assets/images/nav_home.png
    - assets/images/nav_search.png
    - assets/images/nav_add.png
    - assets/images/nav_chat.png
    - assets/images/nav_profile.png